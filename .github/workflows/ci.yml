name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # lint/typecheck both resolve the generated #content module, so Velite
      # has to run once before either — pnpm build runs it again, but that's
      # a cheap no-op on unchanged content.
      - run: pnpm generate
      - run: pnpm lint
      - run: pnpm typecheck
      # TEST-001: no Phase 2 env vars configured here on purpose — every
      # required test (spec §8) is a pure unit test or exercises real
      # fail-closed behavior (lib/auth-guard.ts) rather than needing a live
      # Postgres connection. See docs/phase-3-architecture.md for what a
      # future integration-test tier against a real database would need.
      - run: pnpm test
      - run: pnpm build
