questionType: numeric_response
prompt: "A compact object has observed bolometric luminosity $L=3.90\\times10^{39}$ erg s$^{-1}$. Independent\
  \ evidence indicates this is 1.50 times its Eddington luminosity. Use $L_{Edd}=1.3\\times10^{38}(M/M_\\\
  odot)$ erg s$^{-1}$. Infer the object’s mass in solar masses, to the nearest whole solar mass."
numericAnswer:
  value: 20.0
  tolerance: 0.5
  unit: M_sun
explanation: 'First infer the Eddington luminosity: $L_{Edd}=L/1.50=2.60×10^{39}$ erg s⁻¹. Then $M/M_\odot=L_{Edd}/(1.3×10^{38})=20.0$.
  This is a two-step inversion of the Eddington limit; it does not presume a quantitative disc or spherical
  accretion-rate model.'
author: Renee
source: "Frank, King & Raine, Accretion Power in Astrophysics, 3rd ed., §1.2, “The Eddington limit”. This item uses only the Eddington luminosity relation; it does not assess quantitative spherical or disc accretion."
