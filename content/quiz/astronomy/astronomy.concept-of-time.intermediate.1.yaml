questionType: single_choice
prompt: "The sidereal year is $365.2564$ d and the tropical year is $365.2422$ d. Which explanation of this $\\approx0.0142$ d ($\\approx20$ min) difference is correct?"
choices:
  - text: "Nutation, with its $18.6$-year period, shifts the Sun's return to the equinox by about $20$ minutes each year."
    correct: false
  - text: "Precession moves the vernal equinox westward along the ecliptic by about $50''$ per year, so the Sun returns to the equinox slightly before it completes a full circuit relative to the stars."
    correct: true
  - text: "The tropical year contains one solar day fewer than the sidereal year."
    correct: false
  - text: "The Earth moves faster near perihelion, so it returns to the equinox sooner than to the same stellar position."
    correct: false
explanation: "The equinox drifts about $50''$ per year, i.e. $50''/1{,}296{,}000''\\approx3.9\\times10^{-5}$ of a circle, and the Sun needs $3.9\\times10^{-5}\\times365.25\\approx0.014$ d $\\approx20$ min less than a full sidereal revolution to reach it. Nutation is a small oscillation with zero net drift over its period. The two years differ by a fraction of a day, not a whole day. The orbit's eccentricity does not change the length of a full circuit measured against either reference."
author: Renee
