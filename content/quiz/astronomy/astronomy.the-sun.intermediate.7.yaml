questionId: astronomy.the-sun.intermediate.7
topic: the-sun
difficulty: intermediate
status: draft
archived: false
questionType: true_false_set
prompt: Use $M_\odot = 1.989\times10^{30}$ kg, $L_\odot = 3.9\times10^{26}\ \mathrm{W}$, $c = 3.0\times10^{8}$
  m/s, $T_{\rm phot} = 5785$ K, and the surface differential-rotation law $\Omega = 14.5^\circ - 2.9^\circ\sin^2\psi$
  per day. Judge each statement independently as true or false.
statements:
- text: The region within $0.25\,R_\odot$, which produces 99% of the solar energy, contains only about
    1.6% of the Sun's volume.
  isTrue: true
- text: Since 99% of the energy is generated inside $0.25\,R_\odot$, the convective envelope beyond $0.7\,R_\odot$
    must contribute more than 1% of the luminosity by generating energy of its own.
  isTrue: false
- text: A sunspot umbra 1500 K cooler than the 5785 K photosphere radiates more than half as much energy
    per unit area as the surrounding photosphere.
  isTrue: false
- text: At the present luminosity, converting mass to energy for $10^{10}$ years uses up less than 0.1%
    of the Sun's mass.
  isTrue: true
- text: After 100 days, a point on the equator has turned about $220^\circ$ farther than a point at $60^\circ$
    latitude.
  isTrue: true
explanation: '(1) True: volume scales as $r^3$, so $(0.25)^3 = 1/64 = 1.6\%$. (2) False: the energy is
  generated by the pp chain in the small central region; the envelope only transports energy outwards
  (by convection beyond about $0.7\,R_\odot$), so the statement contradicts the 99% figure, which leaves
  at most 1% to everything outside $0.25\,R_\odot$. (3) False: the flux ratio is $(4285/5785)^4 = 0.30$,
  i.e. the umbra radiates only about 30% as much per unit area, which is why it looks dark. (4) True:
  $\dot m = L/c^2 = 4.3\times10^{9}$ kg/s; over $10^{10}\,\mathrm{yr} = 3.16\times10^{17}$ s this is $1.4\times10^{27}$
  kg, i.e. $6.9\times10^{-4}$ of $M_\odot$ (0.07%). (5) True: $\Omega(0^\circ) = 14.5^\circ$/d and $\Omega(60^\circ)
  = 14.5 - 2.9\times0.75 = 12.325^\circ$/d; the difference $2.175^\circ$/d accumulates to $217.5^\circ$
  in 100 days. A common error is to use $B$ without the factor $\sin^2\psi$, which would give $290^\circ$.'
author: Renee
source: Karttunen et al., Fundamental Astronomy (6th ed.), Sect. 13.1, pp. 283–285; Sect. 13.3, p. 290;
  Example 13.1, p. 297
