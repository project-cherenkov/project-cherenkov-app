topic: accretion-processes
difficulty: advanced
status: draft
archived: false
questionType: multiple_select
prompt: Two compact X-ray sources are observed. Source A shows strictly periodic pulses with $P=2.4$ s, and the
  period slowly decreases. Source B shows no pulses but irregular X-ray variability on a time scale of 1 ms. Select
  all statements that are justified.
choices:
- text: Source A must contain a neutron star, because X-ray pulsars can only be neutron stars.
  correct: true
- text: Source B must be a black hole, because it shows no pulses.
  correct: false
- text: Source B's emitting region cannot be much larger than about $c\,\Delta t\approx300$ km.
  correct: true
- text: The decreasing period of A is consistent with spin-up of the neutron star by angular momentum carried by
    the accreted gas.
  correct: true
- text: If A is a high-mass binary, its gas must be supplied by Roche-lobe overflow of a companion below 1.2 $M_\odot$.
  correct: false
- text: The 1 ms variability proves that the mass of B exceeds 3 $M_\odot$.
  correct: false
explanation: 'Correct set: options 1, 3 and 4. 1: pulsed X-ray emission requires a rotating, magnetised neutron
  star with gas channelled onto its poles. 3: variations over a time $\Delta t$ cannot be coherent over a region
  much larger than $c\,\Delta t=3.0\times10^{8}\ \mathrm{m\,s^{-1}}\times10^{-3}\ \mathrm{s}=300$ km, which indicates
  a compact object. 4: the pulse period of X-ray pulsars decreases with time, consistent with accretion torque.
  Option 2 is false: for non-pulsing sources it can be difficult to tell whether the primary is a neutron star or
  a black hole. Option 5 is false: by definition a high-mass system has a companion of more than about 10 $M_\odot$,
  and its gas comes mainly from a strong stellar wind. Option 6 is false: the time scale limits size only and gives
  no mass.'
