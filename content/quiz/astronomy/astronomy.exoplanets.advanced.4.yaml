questionId: astronomy.exoplanets.advanced.4
topic: exoplanets
difficulty: advanced
status: draft
archived: false
questionType: numeric_response
prompt: A star of mass $0.90\,M_\odot$ shows transits and a radial-velocity curve of period $P=3.50$ d and semi-amplitude
  $K=70.0$ m/s. Because it transits, take the orbit to be exactly edge-on ($\sin i=1$) and circular, and assume
  the planet mass is much smaller than the star's. Use $G=6.674\times10^{-11}\ \mathrm{m^3kg^{-1}s^{-2}}$, $M_\odot=1.989\times10^{30}$
  kg and $M_\mathrm{Jup}=1.898\times10^{27}$ kg. Find the planet's mass. Enter the value in units of $M_\mathrm{Jup}$,
  rounded to three decimal places.
numericAnswer:
  value: 0.488
  tolerance: 0.005
  unit: M_Jup
explanation: 'Step 1 – orbital radius from Kepler''s third law (planet mass negligible): $a=(GMP^2/4\pi^2)^{1/3}$
  with $M=1.790\times10^{30}$ kg and $P=3.024\times10^{5}$ s gives $a\approx6.52\times10^{9}$ m ($\approx0.0436$
  au). Step 2 – planet''s orbital speed: $v_\mathrm{p}=2\pi a/P\approx1.354\times10^{5}$ m/s. Step 3 – momentum
  balance about the centre of mass: $M K=m\,v_\mathrm{p}$ (edge-on, so the star''s line-of-sight amplitude equals
  its orbital speed), so $m=MK/v_\mathrm{p}=1.790\times10^{30}\times70.0/1.354\times10^{5}\approx9.26\times10^{26}$
  kg $=0.488\,M_\mathrm{Jup}$. The assumption $m\ll M$ holds ($m/M\approx5\times10^{-4}$). The tolerance $\pm0.005\,M_\mathrm{Jup}$
  (about 1 %) covers rounding of constants and intermediate steps; the dominant error sources in this chain are
  not the arithmetic but the assumptions listed in the prompt.'
author: Renee
source: Fundamental Astronomy (6th ed.), Sect. 22.2, pp. 459–460
