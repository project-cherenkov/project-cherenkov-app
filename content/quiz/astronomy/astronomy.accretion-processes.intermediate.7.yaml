questionType: numeric_response
prompt: 'An object of mass $15.0\,M_\odot$ radiates at $L=2.925\times10^{39}$ erg s$^{-1}$. Use $L_{Edd}=1.3\times10^{38}(M/M_\odot)$ erg s$^{-1}$. What is the dimensionless Eddington ratio $L/L_{Edd}$? Enter to two decimal places.'
numericAnswer:
  value: 1.5
  tolerance: 0.02
  unit: dimensionless
explanation: The Eddington luminosity is $1.3×10^{38}×15.0=1.95×10^{39}$ erg s⁻¹. The ratio is $2.925/1.95=1.50$.
  A value above one is super-Eddington relative to the idealised limit; the item asks only for the ratio
  and does not model the flow structure.
author: Renee
source: "Frank, King & Raine, Accretion Power in Astrophysics, 3rd ed., §1.2, “The Eddington limit”. This item uses only the Eddington luminosity relation; it does not assess quantitative spherical or disc accretion."
