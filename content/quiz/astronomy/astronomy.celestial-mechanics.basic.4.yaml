prompt: "Why is it wrong to assume constant orbital speed when estimating an eccentric planet's transit duration?"
choices:
  - text: "Kepler's second law means the planet sweeps equal areas in equal time, so its speed varies with orbital position"
    correct: true
  - text: "Transit duration depends only on the orbital period, never on speed"
    correct: false
  - text: "The star's brightness changes the planet's velocity during transit"
    correct: false
  - text: "Eccentricity affects orbit shape but never orbital speed"
    correct: false
explanation: "For an eccentric orbit, Kepler's second law means the planet moves fastest near periapsis and slowest near apoapsis — transit duration has to account for where in the orbit the transit occurs."
