questionType: numeric_response
prompt: 'An eclipsing binary has a circular orbit seen exactly edge-on ($i=90^\circ$). Star A is large and cool:
  radius $R_A=2R_B$ and $T_A=5000$ K. Star B is small and hot: $T_B=10{,}000$ K. Treat both as uniform blackbody
  discs without limb darkening and use bolometric luminosities $L\propto R^2T^4$. At the primary minimum star B
  is totally hidden behind star A; at the secondary minimum B crosses in front of A. Find the depth of the secondary
  minimum, i.e. the magnitude change from the out-of-eclipse brightness. Enter your answer in magnitudes, rounded
  to three decimal places.'
numericAnswer:
  value: 0.056
  tolerance: 0.002
  unit: mag
explanation: 'Take $R_B=1$ (so $R_A=2$): $L_A\propto4\times5000^4=2.5\times10^{15}$ and $L_B\propto1\times10000^4=1.0\times10^{16}$,
  so $L_{\rm tot}=1.25\times10^{16}$. At the secondary minimum star B covers the fraction $(R_B/R_A)^2=1/4$ of the
  disc of A, removing $0.25L_A=6.25\times10^{14}$. The remaining fraction of light is $1-6.25\times10^{14}/1.25\times10^{16}=0.95$,
  so the depth is $-2.5\lg0.95=0.056$ mag. (The primary minimum would be $2.5\lg(1+L_B/L_A)=1.75$ mag.) Unit: magnitudes.
  The tolerance of $0.002$ mag matches the stated rounding.'
author: Renee
