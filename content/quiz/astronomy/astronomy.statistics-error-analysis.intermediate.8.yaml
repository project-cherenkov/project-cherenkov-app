questionType: numeric_response
prompt: "A derived quantity is $Q=FA$, where independent measurements are $F=12.0\\pm0.3$ and $A=4.0\\\
  pm0.2$ in their respective units. Using first-order propagation for independent uncertainties in a product,\
  \ $\\left(\\sigma_Q/Q\\right)^2=(\\sigma_F/F)^2+(\\sigma_A/A)^2$, calculate the relative standard uncertainty\
  \ as a percentage. Enter to the nearest 0.1 percentage point."
numericAnswer:
  value: 5.6
  tolerance: 0.1
  unit: '%'
explanation: The relative uncertainties are 0.3/12.0=0.025 and 0.2/4.0=0.050. In quadrature, the relative
  standard uncertainty is $\sqrt{0.025^2+0.050^2}=0.05590$, or 5.59%, which rounds to 5.6%. The formula
  and independence assumption are specified; Taylor Ch. 3 supports the propagation rule.
author: Renee
source: "Taylor, An Introduction to Error Analysis, 3e, Chapter 3 (propagation of independent uncertainties in a product)."
