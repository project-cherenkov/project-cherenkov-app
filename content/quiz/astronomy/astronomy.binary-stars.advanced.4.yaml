questionType: numeric_response
prompt: A single-lined spectroscopic binary has a mass function $f=m_2^3\sin^3 i/(m_1+m_2)^2=0.300\,M_\odot$. The
  visible star has mass $m_1=1.00\,M_\odot$. The orbit is circular. Find the minimum possible mass of the unseen
  companion. Enter your answer in solar masses, rounded to two decimal places.
numericAnswer:
  value: 1.1
  tolerance: 0.01
  unit: M_sun
explanation: 'The mass function satisfies $f=m_2^3\sin^3i/(m_1+m_2)^2$. For fixed $f$ and $m_1$, the smallest $m_2$
  occurs when $\sin i$ takes its largest value $1$ (edge-on), since $\sin^3 i\le1$ forces $m_2^3/(m_1+m_2)^2\ge
  f$. Solve the cubic $m_2^3=0.300(1+m_2)^2$: $m_2=1.0$ gives $1.000<1.200$, $m_2=1.10$ gives $1.331>1.323$, and
  the root is $m_2\approx1.097$, i.e. $1.10\,M_\odot$. Any smaller inclination requires a more massive companion.
  Unit: $M_\odot$. The tolerance of $0.01$ matches the stated rounding.'
author: Renee
