questionType: numeric_response
prompt: Consider a flat matter-dominated universe with $\Lambda=0$ (Einstein–de Sitter model), for which the age
  is $t_0=\tfrac23H_0^{-1}$. Take $H_0=68\ \mathrm{km\,s^{-1}\,Mpc^{-1}}$, $1\ \mathrm{Mpc}=3.086\times10^{19}$
  km and $1\ \mathrm{Gyr}=3.156\times10^{16}$ s. Find the age. Enter the value in Gyr, rounded to two decimal places.
numericAnswer:
  value: 9.59
  tolerance: 0.05
  unit: Gyr
explanation: 'Convert the Hubble constant to inverse time: $H_0^{-1}=3.086\times10^{19}\ \mathrm{km}/68\ \mathrm{km\,s^{-1}}=4.538\times10^{17}$
  s $=14.38$ Gyr. Then $t_0=\tfrac23\times14.38=9.59$ Gyr. The result is shorter than the roughly 13–14 Gyr of the
  concordance model; the difference arises because positive $\Lambda$ makes the age larger. The tolerance of 0.05
  Gyr (about 0.5%) covers rounding of the constants.'
author: Renee
