questionType: numeric_response
prompt: A body is at $\mathbf r=(1.50,\,0,\,0)$ au with velocity $\mathbf v=(1.00,\,4.00,\,0)$ au/yr about
  the Sun. With $\mu=4\pi^2=39.478$ au$^3$yr$^{-2}$, compute the eccentricity $e=|\mathbf e|$ of its orbit
  from $\mathbf k=\mathbf r\times\mathbf v$ and $\mathbf e=-\left(\mathbf k\times\mathbf v+\mu\,\mathbf
  r/r\right)/\mu$. Give the dimensionless result to three decimal places.
numericAnswer:
  value: 0.420499
  tolerance: 0.002
  unit: dimensionless (e)
explanation: '$\mathbf k=\mathbf r\times\mathbf v=(0,0,6.00)$. $\mathbf k\times\mathbf v=(-24.0,\,6.00,\,0)$.
  Then $\mathbf e=-\left[(-24.0,6.00,0)+39.478(1,0,0)\right]/39.478=(-0.3921,\,-0.1520,\,0)$ and $e=0.4205$.
  Check with the scalar route: $h=\tfrac12v^2-\mu/r=-17.819$, $k^2=36.0$, $e^2=1+2hk^2/\mu^2$ gives $e=0.4205$,
  the same. Tolerance $\pm0.002$ allows for rounding of intermediate quantities to four significant figures
  by hand.'
author: Renee
