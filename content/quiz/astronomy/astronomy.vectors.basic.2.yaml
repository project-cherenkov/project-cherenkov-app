questionType: single_choice
prompt: Which of the following vectors is perpendicular to $\mathbf A=\hat\imath+2\,\hat\jmath+3\,\hat k$?
choices:
- text: $3\,\hat\imath+3\,\hat\jmath-1\,\hat k$
  correct: false
- text: $\hat\imath+\hat\jmath+\hat k$
  correct: false
- text: $0\,\hat\imath+3\,\hat\jmath+2\,\hat k$
  correct: false
- text: $3\,\hat\imath+0\,\hat\jmath-1\,\hat k$
  correct: true
explanation: Two vectors are perpendicular when their scalar product vanishes. $(1,2,3)\cdot(3,0,-1)=3+0-3=0$. For
  the others the scalar products are $(1,2,3)\cdot(3,3,-1)=6$, $(1,2,3)\cdot(1,1,1)=6$ and $(1,2,3)\cdot(0,3,2)=12$,
  none of which is zero.
