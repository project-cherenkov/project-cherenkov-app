questionType: numeric_response
prompt: "Four independent repeated measurements of a stellar magnitude are 4.0, 5.0, 7.0 and 8.0 mag.\
  \ Calculate the **sample** standard deviation using $s=\\sqrt{\\sum(x_i-\\bar{x})^2/(n-1)}$. Enter in\
  \ mag to the nearest 0.01 mag."
numericAnswer:
  value: 1.83
  tolerance: 0.01
  unit: mag
explanation: The sample mean is 6.0 mag. The squared deviations are 4, 1, 1 and 4, so their sum is 10.
  The sample variance is $10/(4-1)=3.333...$ mag² and $s=\sqrt{3.333...}=1.8257$ mag, which rounds to
  1.83 mag. The denominator is n−1 because the prompt asks for the sample standard deviation.
author: Renee
source: "OpenStax, Introductory Statistics 2e, Chapter 2 (sample standard deviation); Taylor, An Introduction to Error Analysis, 3e, Chapter 4 (standard deviation and repeated measurements)."
