questionType: true_false_set
prompt: Judge each statement about homogeneous and isotropic (Friedmann) universes with $\Lambda=0$ unless otherwise
  stated.
statements:
- text: A model with density above the critical density has $k=+1$ and its expansion eventually reverses into contraction.
  isTrue: true
- text: In the flat Einstein–de Sitter model the age of the Universe is $t_0=1/H_0$.
  isTrue: false
- text: The energy density of radiation falls as $R^{-3}$, just like the density of matter, because the number of
    photons is conserved.
  isTrue: false
- text: A universe that is homogeneous must also be isotropic.
  isTrue: false
- text: The temperature of the cosmic background radiation at redshift $z$ is $T=T_0(1+z)$, where $T_0$ is its present
    temperature.
  isTrue: true
explanation: '1 is true: $k=+1$ corresponds to $\Omega_0>1$, the closed model, which reaches a maximum size and
  collapses. 2 is false: the Einstein–de Sitter age is $t_0=\tfrac23H_0^{-1}$. 3 is false: although the photon number
  density falls as $R^{-3}$, each photon''s energy falls as $R^{-1}$, so the energy density falls as $R^{-4}$. 4
  is false: isotropy at every point implies homogeneity, but not the other way round; a homogeneous universe with
  a uniform magnetic field would be anisotropic. 5 is true: the temperature varies as $R^{-1}$ and $1+z=R_0/R$.'
author: Renee
