prompt: "A 2 kg block moving at 6 m/s collides and sticks to a stationary 4 kg block. What fraction of the initial kinetic energy is lost?"
choices:
  - text: "1/3"
    correct: false
  - text: "1/2"
    correct: false
  - text: "2/3"
    correct: true
  - text: "3/4"
    correct: false
explanation: "Momentum gives v = 12/6 = 2 m/s. KE goes from 36 J to 12 J, so 24/36 = 2/3 is lost."
