name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # lint/typecheck both resolve the generated #content module, so Velite
      # has to run once before either — pnpm build runs it again, but that's
      # a cheap no-op on unchanged content.
      - run: pnpm generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
